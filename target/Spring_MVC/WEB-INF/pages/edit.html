<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit user</title>

    <style>
        .field {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            width: 250px;
        }

        .error {
            min-height: 18px;
            color: red;
            font-size: 12px;
        }

        input {
            padding: 5px;
        }

        button {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>Edit user</h2>

<form th:action="@{/users/edit}" th:object="${user}" method="post">

    <input type="hidden" th:field="*{id}"/>

    <div class="field">
        <input type="text"
               th:field="*{firstName}"
               placeholder="First Name"
               th:classappend="${#fields.hasErrors('firstName')} ? 'error-input' : ''"/>
        <div class="error" th:errors="*{firstName}"></div>
    </div>

    <div class="field">
        <input type="text"
               th:field="*{lastName}"
               placeholder="Last Name"
               th:classappend="${#fields.hasErrors('lastName')} ? 'error-input' : ''"/>
        <div class="error" th:errors="*{lastName}"></div>
    </div>

    <div class="field">
        <input type="text"
               th:field="*{email}"
               placeholder="Email"
               th:classappend="${#fields.hasErrors('email')} ? 'error-input' : ''"/>
        <div class="error" th:errors="*{email}"></div>
    </div>

    <button type="submit">Update</button>
</form>

</body>
</html>
